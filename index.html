```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bean Crew</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="menu" class="screen">
    <div class="panel">
      <h1>BEAN CREW</h1>
      <p>A space-crewmate social deduction game</p>

      <div class="settings">
        <label>
          Players
          <select id="playerCount">
            <option>4</option>
            <option>8</option>
            <option selected>10</option>
            <option>12</option>
            <option>15</option>
          </select>
        </label>

        <label>
          Impostors
          <select id="impostorCount">
            <option>1</option>
            <option selected>2</option>
            <option>3</option>
          </select>
        </label>

        <label>
          Tasks
          <select id="taskCount">
            <option>3</option>
            <option selected>5</option>
            <option>7</option>
          </select>
        </label>

        <label>
          Vision
          <select id="vision">
            <option value="260">Low</option>
            <option value="340" selected>Normal</option>
            <option value="450">High</option>
          </select>
        </label>
      </div>

      <button id="startBtn">START ROUND</button>

      <p class="controls">
        WASD = Move<br>
        E = Interact<br>
        R = Report<br>
        Q = Kill as Impostor<br>
        M = Emergency Meeting
      </p>
    </div>
  </div>

  <div id="game" class="hidden">

    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div>
        ROLE:
        <b id="roleText">CREWMATE</b>
      </div>

      <div>
        TASKS:
        <b id="taskText">0 / 0</b>
      </div>

      <div id="sabotageBox" class="hidden">
        SABOTAGE:
        <b id="sabotageText"></b>
      </div>
    </div>

    <div id="actionBar">
      <button id="reportBtn">REPORT</button>
      <button id="useBtn">USE</button>
      <button id="killBtn" class="hidden">KILL</button>
      <button id="ventBtn" class="hidden">VENT</button>
      <button id="meetingBtn">EMERGENCY</button>
    </div>

    <div id="taskModal" class="modal hidden">
      <div class="modalCard">
        <h2 id="taskTitle">Task</h2>

        <p id="taskDescription"></p>

        <div id="taskMiniGame">
          <div class="taskProgress">
            <div id="taskFill"></div>
          </div>
        </div>

        <button id="finishTask">COMPLETE TASK</button>
        <button class="secondary closeModal">CLOSE</button>
      </div>
    </div>

    <div id="meetingModal" class="modal hidden">
      <div class="meetingCard">
        <h2>EMERGENCY MEETING</h2>

        <p id="meetingReason">
          Discuss who you saw.
        </p>

        <div id="voteGrid"></div>

        <button id="skipVote">
          SKIP
        </button>

        <p id="voteStatus">
          Vote for someone.
        </p>
      </div>
    </div>

    <div id="winScreen" class="modal hidden">
      <div class="modalCard">
        <h1 id="winTitle">
          CREWMATES WIN
        </h1>

        <p id="winReason"></p>

        <button id="playAgain">
          PLAY AGAIN
        </button>
      </div>
    </div>

    <div id="toast"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
```
